<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Logo hibou Duolingo style -->
  <circle cx="50" cy="50" r="45" fill="#58CC02" stroke="#58A700" stroke-width="3"/>
  
  <!-- Yeux -->
  <circle cx="35" cy="40" r="10" fill="white"/>
  <circle cx="65" cy="40" r="10" fill="white"/>
  <circle cx="35" cy="40" r="5" fill="#3C3C3C"/>
  <circle cx="65" cy="40" r="5" fill="#3C3C3C"/>
  <circle cx="35" cy="40" r="2" fill="white"/>
  <circle cx="65" cy="40" r="2" fill="white"/>
  
  <!-- Bec -->
  <path d="M45 55 Q50 65 55 55" fill="#FFC800" stroke="#DDA800" stroke-width="2"/>
  
  <!-- Sourcils -->
  <path d="M25 30 Q35 25 45 32" fill="none" stroke="#3C3C3C" stroke-width="3" stroke-linecap="round"/>
  <path d="M55 32 Q65 25 75 30" fill="none" stroke="#3C3C3C" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Ailes -->
  <ellipse cx="30" cy="70" rx="15" ry="10" fill="#4CAD00" stroke="#58A700" stroke-width="2"/>
  <ellipse cx="70" cy="70" rx="15" ry="10" fill="#4CAD00" stroke="#58A700" stroke-width="2"/>
  
  <!-- Détails mignons -->
  <circle cx="40" cy="75" r="2" fill="white"/>
  <circle cx="60" cy="75" r="2" fill="white"/>
</svg>